[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "selcom-client"
dynamic = ["version"]
description = "Typed sync and async Python client for the Selcom API gateway (community project, not affiliated with Selcom Paytech Ltd)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "The Selcom Developers community contributors" }]
keywords = ["selcom", "payments", "tanzania", "mobile-money", "httpx"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/selcom-developers/py-selcom"
Specification = "https://github.com/selcom-developers/selcom-spec"
Changelog = "https://github.com/selcom-developers/py-selcom/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.hatch.version]
path = "src/selcom_client/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/selcom_client"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/README.md", "/LICENSE", "/CHANGELOG.md", "/SPEC_VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["sandbox: opt-in tests against the real sandbox (need SELCOM_SANDBOX_* variables)"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "scripts"]
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "S", "PT", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"scripts/**" = ["S603", "S607"]
